[package]
name = "mellow"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "A calm, modern terminal editor by Ritru Labs. No modes, no manual: just start typing."
license = "Apache-2.0"
repository = "https://github.com/ritru-labs/mellow"
homepage = "https://github.com/ritru-labs/mellow"
readme = "README.md"
keywords = ["terminal", "editor", "tui", "text-editor", "rust"]
categories = ["command-line-utilities", "text-editors"]
exclude = [
    ".claude",
    ".dockerignore",
    ".github",
    ".ignore",
    ".mcp.json",
    "CLAUDE.md",
    "Dockerfile.dev",
    "Makefile",
    "compose.yml",
    "docs",
    "mkdocs.yml",
    "packaging",
    "scripts",
]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ropey = "1.6"
serde_json = "1"
signal-hook = "0.3"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-hcl = "1.1"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-yaml = "0.7"
unicode-segmentation = "1"
unicode-width = "0.2"
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3"
