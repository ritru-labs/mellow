site_name: Mellow
site_description: Learn Mellow, the modeless Rust terminal editor for macOS and Linux. Installation, first edit, project workflows and architecture.
site_url: https://ritru-labs.github.io/mellow/
repo_url: https://github.com/ritru-labs/mellow
repo_name: ritru-labs/mellow
edit_uri: edit/main/docs/
copyright: Mellow is crafted by Ritru Labs. Apache-2.0.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ritru-labs/mellow
      name: Mellow on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Start here:
      - Install: install.md
      - First edit: getting-started.md
      - Everyday workflows: usage.md
  - Reference:
      - Keyboard shortcuts: keys.md
      - Settings: settings.md
      - Themes: themes.md
      - Language servers: language-servers.md
      - Optional AI: ai.md
      - Troubleshooting and limits: faq.md
  - Project:
      - Architecture: ARCHITECTURE.md
      - Development and docs: development.md
      - Product goals: PRODUCT.md
      - Design contract: DESIGN_CONTRACT.md
      - Testing: TESTING.md
      - Visual QA: VISUAL_QA.md
      - Release checklist: RELEASE_CHECKLIST.md
