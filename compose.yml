services:
  mellow-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
      CARGO_HOME: /cargo
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/workspace
      - mellow-cargo-registry:/cargo/registry
      - mellow-cargo-git:/cargo/git
      - mellow-target:/target

volumes:
  mellow-cargo-registry:
  mellow-cargo-git:
  mellow-target:
